<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>Ohkini! Bridge</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-state="idle">
    <main class="app">
      <h1 class="app__title">Ohkini! Bridge</h1>
      <p class="app__subtitle">Speak English, hear Osaka.</p>

      <section class="controls">
        <fieldset class="direction">
          <legend class="sr-only">Translation direction</legend>
          <label class="direction__option">
            <input type="radio" name="direction" value="en-ja" checked />
            <span>EN &rarr; JP</span>
          </label>
          <label class="direction__option">
            <input type="radio" name="direction" value="ja-en" />
            <span>JP &rarr; EN</span>
          </label>
        </fieldset>

        <label class="kansai">
          <input type="checkbox" id="kansai-ben" checked />
          <span>Kansai-ben</span>
        </label>
      </section>

      <section class="mic">
        <button id="mic" class="mic__button" type="button" aria-pressed="false">
          <svg class="mic__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z" />
            <path d="M5 11v1a7 7 0 0 0 14 0v-1" fill="none" stroke-width="2" stroke-linecap="round" />
            <path d="M12 19v2.5" fill="none" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span class="sr-only" id="mic-label">Start listening</span>
        </button>
        <p class="status" id="status" role="status">Tap the mic and speak</p>
      </section>

      <p class="error" id="error" role="alert" hidden></p>

      <section class="phrases" aria-label="Quick phrases">
        <h2 class="panel__title">Quick phrases</h2>
        <div class="phrases__row">
          <button class="panel__action phrase" type="button">Where is the station?</button>
          <button class="panel__action phrase" type="button">This is delicious!</button>
          <button class="panel__action phrase" type="button">How much is this?</button>
          <button class="panel__action phrase" type="button">Thank you so much</button>
          <button class="panel__action phrase" type="button">Can you speak slowly?</button>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel__title">Transcript</h2>
        <output class="panel__body" id="transcript" for="mic"></output>
      </section>

      <section class="panel">
        <h2 class="panel__title">Translation</h2>
        <output class="panel__body" id="translation" for="mic"></output>
        <button class="panel__action" id="replay" type="button" hidden>Play again</button>
      </section>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
